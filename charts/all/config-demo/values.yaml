---
# Vault path for the demo value must match ocpSecretsStoreCsiVault.objects[].secretPath below.

# Cluster merged CA bundle (CNO inject-trusted-cabundle) in the app namespace — same trust model as
# openshift-sscsi-vault for Vault HTTPS. Mount path should stay aligned with ocpSecretsStoreCsiVault.tls.vaultCACertPath.
vaultCaBundle:
  enabled: true
  configMapName: config-demo-vault-tls-ca
  mountPath: /etc/pki/vault-ca
  bundleKey: ca-bundle.crt

# Init container: fail the pod if Vault HTTPS cannot be verified with vaultCACertPath (SS-CSI + TLS verify on).
vaultTlsPrecheck:
  enabled: true
  image:
    repository: registry.access.redhat.com/ubi9/ubi
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Seconds to wait for CNO-injected CA file before failing
  caWaitSeconds: 120

global:
  hubClusterDomain: hub.example.com
  localClusterDomain: region-one.example.com

clusterGroup:
  isHubCluster: true
  # Pattern values merge the full `clusterGroup.applications` tree at deploy time (hub + spokes).

# Subchart vp-sscsi-spc: disable its default template output; parent renders SPC via include only.
vp-sscsi-spc:
  ocpSecretsStoreCsiVault:
    secretProviderClass:
      enabled: false
      installDefaultManifests: false

# App SecretProviderClass (vp-sscsi-spc helper). Role and namespace resolve from
# clusterGroup.applications[applicationKey].ssCsiWorkloadAuth when set (see values-hub / values-group-one).
ocpSecretsStoreCsiVault:
  applicationKey: openshift-sscsi-vault
  workloadAuthIndex: 0
  secretProviderClass:
    installDefaultManifests: true
    enabled: true
    name: config-demo-vault-csi
    namespace: ""
  objects:
    - objectName: secret
      secretPath: secret/data/global/config-demo
      secretKey: secret
  secretObjects: []
  vault:
    externalAddress: ""
    hubMountPath: hub
  # Required: vp_sscsi_spc.secretproviderclass dereferences .auth.roleName (no default guard). Coalesce order is
  # workload-derived role first, then this, then the literal hub-role in the template.
  auth:
    roleName: hub-role
  tls:
    vaultSkipTLSVerify: "false"
    # Default openshift-sscsi-vault sync ConfigMap uses CNO-injected trustedCabundleDataKey (ca-bundle.crt).
    vaultCACertPath: /etc/pki/vault-ca/ca-bundle.crt
    vaultTLSServerName: ""

image:
  repository: registry.access.redhat.com/ubi10/httpd-24
  tag: "10.0-1755779646"
  pullPolicy: IfNotPresent
