---
# Vault path for the demo value must match ocpSecretsStoreCsiVault.objects[].secretPath below.

# Cluster merged CA bundle (CNO inject-trusted-cabundle) in the app namespace — same trust model as
# openshift-sscsi-vault for Vault HTTPS. Mount path should stay aligned with ocpSecretsStoreCsiVault.tls.vaultCACertPath.
vaultCaBundle:
  enabled: true
  configMapName: config-demo-vault-tls-ca
  mountPath: /etc/pki/vault-ca
  bundleKey: ca-bundle.crt

# Second workload (config-demo2): separate Deployment, SA, SPC (same Vault objects as primary),
# and rollout CronJob. SPC is rendered via vp_sscsi_spc with workloadAuthIndex 1 (see
# clusterGroup.applications.config-demo.ssCsiWorkloadAuth[1] in values-hub / group-one / standalone).
configDemo2:
  enabled: true

# Overrides merged into a copy of ocpSecretsStoreCsiVault for the second SecretProviderClass
# (vp-sscsi-spc 0.2.x / multiple workloads: distinct SPC per serviceAccount + workloadAuthIndex).
ocpSecretsStoreCsiVault2:
  workloadAuthIndex: 1
  secretProviderClass:
    name: config-demo2-vault-csi

# CronJob: if the Deployment is stuck (ProgressDeadlineExceeded), run oc rollout restart.
rolloutWatch:
  enabled: true
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  # Pod activeDeadlineSeconds for each Job run (shell exits quickly when no action).
  jobActiveDeadlineSeconds: 180
  image:
    repository: quay.io/openshift/origin-cli
    tag: "4.17.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Init container: fail the pod if Vault HTTPS cannot be verified with vaultCACertPath (SS-CSI + TLS verify on),
# and if the Vault CSI secret file is missing (e.g. auth role not ready yet).
vaultTlsPrecheck:
  enabled: true
  image:
    repository: registry.access.redhat.com/ubi9/ubi
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Wall time for init precheck once the pod has started (CSI volume mounted, init container running).
  # Note: activeDeadlineSeconds is not allowed on pods under a Deployment on OpenShift.
  initDeadlineSeconds: 120
  # Deployment.spec.progressDeadlineSeconds (not pod activeDeadlineSeconds). Marks stalled rollouts; rolloutWatch
  # restarts when reason is ProgressDeadlineExceeded. Keep aligned with initDeadlineSeconds + CSI mount headroom.
  rolloutProgressDeadlineSeconds: 120
  # Same path as the main container CSI mount; init verifies the secret file before apache starts.
  secretMountPath: /var/www/html/secret
  # If empty, uses the first ocpSecretsStoreCsiVault.objects[].objectName (file name at secretMountPath).
  secretObjectFileName: ""

global:
  hubClusterDomain: hub.example.com
  localClusterDomain: region-one.example.com
  # Spoke-style default for helm template/lint (pattern sets from ACM; without apps. prefix per clustergroup-chart).
  clusterDomain: region-one.example.com

# Pattern values merge full clusterGroup at deploy time; minimal shape for helm lint/template without pattern overlays.
clusterGroup:
  applications: {}

# Subchart vp-sscsi-spc: disable its default template output; parent renders SPC via include only.
vp-sscsi-spc:
  ocpSecretsStoreCsiVault:
    secretProviderClass:
      enabled: false
      installDefaultManifests: false

# App SecretProviderClass (vp-sscsi-spc helper). Namespace and SA resolve from
# clusterGroup.applications[applicationKey].ssCsiWorkloadAuth when set (see values-hub / values-group-one).
# With roleSlug, roleName is <vaultKubernetesMountPath>-sscsi-<roleSlug> (same mount as ESO: hub or global.clusterDomain).
ocpSecretsStoreCsiVault:
  applicationKey: config-demo
  workloadAuthIndex: 0
  secretProviderClass:
    installDefaultManifests: true
    enabled: true
    name: config-demo-vault-csi
    namespace: ""
  objects:
    - objectName: secret
      secretPath: secret/data/global/config-demo
      secretKey: secret
  secretObjects: []
  vault:
    externalAddress: ""
    hubMountPath: hub
  # Fallback when ssCsiWorkloadAuth has no roleSlug: hub uses this then hub-role; spoke uses <clusterDomain>-role (ESO-style).
  # With roleSlug, workload-derived role is <mount>-sscsi-<roleSlug> (see vp-sscsi-spc README).
  auth:
    roleName: hub-role
  tls:
    vaultSkipTLSVerify: "false"
    # Default openshift-sscsi-vault sync ConfigMap uses CNO-injected trustedCabundleDataKey (ca-bundle.crt).
    vaultCACertPath: /etc/pki/vault-ca/ca-bundle.crt
    vaultTLSServerName: ""

image:
  repository: registry.access.redhat.com/ubi10/httpd-24
  tag: "10.0-1755779646"
  pullPolicy: IfNotPresent
