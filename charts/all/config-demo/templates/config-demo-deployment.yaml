apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    application: config-demo
  name: config-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      deploymentconfig: config-demo
  template:
    metadata:
      labels:
        app: config-demo
        deploymentconfig: config-demo
      name: config-demo
    spec:
      serviceAccountName: config-demo-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if eq (include "config-demo.vaultTlsPrecheckEnabled" .) "true" }}
      initContainers:
        - name: vault-tls-precheck
          image: "{{ .Values.vaultTlsPrecheck.image.repository }}:{{ .Values.vaultTlsPrecheck.image.tag }}"
          imagePullPolicy: {{ .Values.vaultTlsPrecheck.image.pullPolicy }}
          env:
            - name: VAULT_ADDR
              value: {{ include "config-demo.vaultUrl" . | quote }}
            - name: VAULT_CA_PATH
              value: {{ .Values.ocpSecretsStoreCsiVault.tls.vaultCACertPath | quote }}
            - name: CA_WAIT_SECONDS
              value: {{ .Values.vaultTlsPrecheck.caWaitSeconds | quote }}
          command:
            - /bin/bash
            - -ec
            - |
              echo "Waiting up to ${CA_WAIT_SECONDS}s for CA bundle at ${VAULT_CA_PATH}"
              for ((i=0; i<CA_WAIT_SECONDS; i++)); do
                if [[ -s "${VAULT_CA_PATH}" ]]; then
                  break
                fi
                sleep 1
              done
              if [[ ! -s "${VAULT_CA_PATH}" ]]; then
                echo "ERROR: CA bundle missing or empty at ${VAULT_CA_PATH}" >&2
                exit 1
              fi
              echo "Verifying TLS to ${VAULT_ADDR} using ${VAULT_CA_PATH}"
              # Do not use curl -f: Vault returns non-2xx for sealed/uninitialized; TLS success is enough.
              if ! curl -g -sS --cacert "${VAULT_CA_PATH}" --connect-timeout 15 --max-time 45 \
                  -o /dev/null "${VAULT_ADDR}/v1/sys/health"; then
                echo "ERROR: could not complete TLS connection to Vault (check CA bundle vs Route cert)" >&2
                exit 1
              fi
              echo "Vault TLS precheck passed."
          volumeMounts:
            - name: vault-tls-ca
              mountPath: {{ .Values.vaultCaBundle.mountPath | quote }}
              readOnly: true
          resources:
            {{- toYaml .Values.vaultTlsPrecheck.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      {{- end }}
      containers:
      - name: apache
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        volumeMounts:
        - mountPath: /var/www/html
          name: config-demo-configmap
        - mountPath: /var/www/html/secret
          readOnly: true
          name: config-demo-secret
        {{- if .Values.vaultCaBundle.enabled }}
        - mountPath: {{ .Values.vaultCaBundle.mountPath | quote }}
          name: vault-tls-ca
          readOnly: true
        {{- end }}
        - mountPath: /tmp
          name: tmp-volume
        - mountPath: /var/cache/httpd
          name: cache-volume
        - mountPath: /var/run/httpd
          name: run-volume
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        livenessProbe:
          httpGet:
            path: /index.html
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /index.html
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: config-demo-configmap
        configMap:
          defaultMode: 438
          name: config-demo-configmap
      - name: config-demo-secret
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: config-demo-vault-csi
      {{- if .Values.vaultCaBundle.enabled }}
      - name: vault-tls-ca
        projected:
          defaultMode: 420
          sources:
            - configMap:
                name: {{ .Values.vaultCaBundle.configMapName }}
                optional: true
                items:
                  - key: {{ .Values.vaultCaBundle.bundleKey }}
                    path: {{ .Values.vaultCaBundle.bundleKey }}
      {{- end }}
      - name: tmp-volume
        emptyDir: {}
      - name: cache-volume
        emptyDir: {}
      - name: run-volume
        emptyDir: {}
