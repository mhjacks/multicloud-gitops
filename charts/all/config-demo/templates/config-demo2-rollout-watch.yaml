{{- if and .Values.rolloutWatch.enabled .Values.configDemo2.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-demo2-rollout-watch
  labels:
    application: config-demo2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-demo2-rollout-watch
  labels:
    application: config-demo2
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-demo2-rollout-watch
  labels:
    application: config-demo2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-demo2-rollout-watch
subjects:
  - kind: ServiceAccount
    name: config-demo2-rollout-watch
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: config-demo2-rollout-watch
  labels:
    application: config-demo2
spec:
  schedule: {{ .Values.rolloutWatch.schedule | quote }}
  concurrencyPolicy: {{ .Values.rolloutWatch.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ int .Values.rolloutWatch.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ int .Values.rolloutWatch.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ int .Values.rolloutWatch.startingDeadlineSeconds }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ int .Values.rolloutWatch.jobActiveDeadlineSeconds }}
      backoffLimit: 2
      template:
        metadata:
          labels:
            application: config-demo2
            app.kubernetes.io/name: config-demo2-rollout-watch
        spec:
          serviceAccountName: config-demo2-rollout-watch
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rollout-watch
              image: "{{ .Values.rolloutWatch.image.repository }}:{{ .Values.rolloutWatch.image.tag }}"
              imagePullPolicy: {{ .Values.rolloutWatch.image.pullPolicy }}
              resources:
                {{- toYaml .Values.rolloutWatch.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/bash
                - -ec
                - |
                  set -euo pipefail
                  NS="{{ .Release.Namespace }}"
                  DEPLOY="config-demo2"
                  if ! oc get deploy "${DEPLOY}" -n "${NS}" >/dev/null 2>&1; then
                    echo "deployment ${DEPLOY} not found in ${NS}, exiting"
                    exit 0
                  fi
                  prog_status=$(oc get deploy "${DEPLOY}" -n "${NS}" -o jsonpath='{.status.conditions[?(@.type=="Progressing")].status}' 2>/dev/null || true)
                  prog_reason=$(oc get deploy "${DEPLOY}" -n "${NS}" -o jsonpath='{.status.conditions[?(@.type=="Progressing")].reason}' 2>/dev/null || true)
                  if [[ "${prog_status}" == "False" && "${prog_reason}" == "ProgressDeadlineExceeded" ]]; then
                    echo "$(date -Is) ${DEPLOY}: ${prog_reason}; oc rollout restart"
                    oc rollout restart "deploy/${DEPLOY}" -n "${NS}"
                    exit 0
                  fi
                  echo "$(date -Is) ${DEPLOY}: no restart (Progressing status=${prog_status} reason=${prog_reason})"
{{- end }}
