clusterGroup:
  name: hub
  # Namespace is a dictionary for easier overriding (lists are supported as well)
  namespaces:
    open-cluster-management:
    vault:
    openshift-cluster-csi-drivers:
      operatorGroup: true
      targetNamespaces: []
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    external-secrets:
    config-demo:
    hello-world:
  subscriptions:
    acm:
      name: advanced-cluster-management
      namespace: open-cluster-management
      channel: release-2.16
      # csv: advanced-cluster-management.v2.6.1
    openshift-sscsi:
      name: secrets-store-csi-driver-operator
      namespace: openshift-cluster-csi-drivers
      channel: stable
      source: redhat-operators
      sourceNamespace: openshift-marketplace
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
  argoProjects:
    - hub
    - eso
    - config-demo
    - hello-world
  # Explicitly mention the cluster-state based overrides we plan to use for this pattern.
  # We can use self-referential variables because the chart calls the tpl function with these variables defined
  sharedValueFiles:
    - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'
    - '/overrides/values-{{ $.Values.global.clusterVersion }}-{{ $.Values.clusterGroup.name }}.yaml'
  # sharedValueFiles is a flexible mechanism that will add the listed valuefiles to every app defined in the
  # applications section. We intend this to supplement and possibly even replace previous "magic" mechanisms, though
  # we do not at present have a target date for removal.
  #
  # To replicate the "classic" magic include structure, the clusterGroup would need all of these
  # sharedValueFiles, in this order:
  #   - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'
  #   - '/overrides/values-{{ $.Values.global.clusterPlatform }}-{{ $.Values.global.clusterVersion }}.yaml'
  #   - '/overrides/values-{{ $.Values.global.clusterPlatform }}-{{ $.Values.clusterGroup.name }}.yaml'
  #   - '/overrides/values-{{ $.Values.global.clusterVersion }}-{{ $.Values.clusterGroup.name }}.yaml"
  #   - '/overrides/values-{{ $.Values.global.localClusterName }}.yaml'

  # This kind of variable substitution will work with any of the variables the Validated Patterns operator knows
  # about and sets, so this is also possible, for example:
  #   - '/overrides/values-{{ $.Values.global.hubClusterDomain }}.yaml'
  #   - '/overrides/values-{{ $.Values.global.localClusterDomain }}.yaml'
  applications:
    acm:
      name: acm
      namespace: open-cluster-management
      argoProject: hub
      chart: acm
      chartVersion: 0.2.*
    # HashiCorp Vault server (VP hashicorp-vault chart). Vault CSI provider DaemonSet is only from openshift-sscsi-vault.
    vault:
      name: vault
      namespace: vault
      argoProject: hub
      chart: hashicorp-vault
      chartVersion: 0.1.*
    # ESO chart + operator: rhvp.cluster_utils (hub-role, spoke auth, SA token). Config-demo secrets use SSCSI + vp-sscsi-spc.
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      argoProject: eso
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    # Hub/spoke Proxy trustedCA + bundle (from aap-starter-kit; ACM enabled on this pattern by default).
    vp-cluster-truster:
      name: vp-manage-proxy-cluster-ca
      namespace: openshift-config
      argoProject: hub
      chart: vp-manage-proxy-cluster-ca
      chartVersion: 0.1.*
    # Cluster-wide Vault CSI (vault ns). Per-app SecretProviderClass: charts/all/config-demo (vp-sscsi-spc library).
    openshift-sscsi-vault:
      name: openshift-sscsi-vault-hubcluster
      namespace: vault
      argoProject: hub
      chart: openshift-sscsi-vault
      chartVersion: 0.2.*
      # CNO fills ConfigMap.data after apply; ignore whole data blob vs one key.
      ignoreDifferences:
        - group: ""
          kind: ConfigMap
          name: openshift-sscsi-vault-vault-tls-ca
          namespace: vault
          jsonPointers:
            - /data
          jqPathExpressions:
            - .data
      syncPolicy:
        automated: {}
        retry:
          limit: 20
        syncOptions:
          - RespectIgnoreDifferences=true
    config-demo:
      name: config-demo
      namespace: config-demo
      argoProject: config-demo
      path: charts/all/config-demo
      ignoreDifferences:
        - group: ""
          kind: ConfigMap
          name: config-demo-vault-tls-ca
          namespace: config-demo
          jsonPointers:
            - /data
          jqPathExpressions:
            - .data
      syncPolicy:
        automated: {}
        retry:
          limit: 20
        syncOptions:
          - RespectIgnoreDifferences=true
      # rhvp.cluster_utils: vault_ss_csi_workload_auth reads this and creates Vault Kubernetes auth roles
      # (<hub mount>-sscsi-<roleSlug>). vp-sscsi-spc uses the same mount + slug for hub SecretProviderClass.
      ssCsiWorkloadAuth:
        - serviceAccount: config-demo-sa
          namespace: config-demo
          roleSlug: config-demo-config-demo-sa-config-demo
        - serviceAccount: config-demo2-sa
          namespace: config-demo
          roleSlug: config-demo-config-demo2-sa-config-demo
    hello-world:
      name: hello-world
      namespace: hello-world
      argoProject: hello-world
      path: charts/all/hello-world
  imperative:
    verbosity: '-vvv'
    extraPlaybookArgs:
      - '-e'
      - 'pattern_dir=/git/repo'
    ansibleDevMode:
      enabled: true
      requirementsFile: requirements.yml
      requirementsContent: |
        ---
        collections:
          - name: git+https://github.com/mhjacks/rhvp.cluster_utils.git,feature/sscsi-vp-proxy-cluster-ca-chart
      ansibleCfgContent: |
        [defaults]
        localhost_warning=False
        retry_files_enabled=False
        # Retry files disabled to avoid cluttering CI/CD environments
        interpreter_python=auto_silent
        timeout=30
        library=~/.ansible/plugins/modules:./ansible/plugins/modules:./common/ansible/plugins/modules:/usr/share/ansible/plugins/modules
        roles_path=~/.ansible/roles:./ansible/roles:./common/ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
        filter_plugins=~/.ansible/plugins/filter:./ansible/plugins/filter:./common/ansible/plugins/filter:/usr/share/ansible/plugins/filter
        collections_path=~/.ansible/collections:/usr/share/ansible/collections
    # clustergroup-chart replaces the default imperative ClusterRole rules when this is set (see
    # templates/imperative/clusterrole.yaml), so keep the chart default get/list/watch on * plus
    # create/update/patch on ConfigMaps cluster-wide (vault_ss_csi_* route CA ConfigMaps, etc.).
    clusterRoleYaml:
      - apiGroups:
          - '*'
        resources:
          - '*'
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - ''
        resources:
          - configmaps
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
    # NOTE: We *must* use lists and not hashes. As hashes lose ordering once parsed by helm
    # The default schedule is every 10 minutes: imperative.schedule
    # Total timeout of all jobs is 1h: imperative.activeDeadlineSeconds
    # imagePullPolicy is set to always: imperative.imagePullPolicy
    # For additional overrides that apply to the jobs, please refer to
    # https://validatedpatterns.io/patterns/multicloud-gitops/mcg-imperative-actions/
    jobs:
      - name: hello-world
        # ansible playbook to be run
        playbook: rhvp.cluster_utils.hello_world
        # per playbook timeout in seconds
        timeout: 234
        # verbosity: "-v"
  # OCP: Secrets Store CSI operator alone does not register the driver; ClusterCSIDriver is required
  # (see "Installing the Secrets Store CSI driver" in OpenShift CSI docs).
  extraObjects:
    secrets-store-csi-clustercsidriver:
      apiVersion: operator.openshift.io/v1
      kind: ClusterCSIDriver
      metadata:
        name: secrets-store.csi.k8s.io
      spec:
        managementState: Managed
        logLevel: Normal
        operatorLogLevel: Normal
  managedClusterGroups:
    exampleRegion:
      name: group-one
      acmlabels:
        - name: clusterGroup
          value: group-one
      # SS-CSI workload auth for group-one (region) spokes: values-group-one.yaml under
      # clusterGroup.applications.openshift-sscsi-vault.ssCsiWorkloadAuth (rhvp.cluster_utils vault_ss_csi_workload_auth).
      # Spoke Vault roles use vault_path (FQDN); vp-sscsi-spc roleName uses global.clusterDomain on the spoke.
