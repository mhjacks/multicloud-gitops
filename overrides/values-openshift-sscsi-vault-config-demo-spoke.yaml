# Same cluster-wide openshift-sscsi-vault release on managed/spoke clusters (vault namespace).
# Chart source: validatedpatterns/openshift-sscsi-vault-chart, Argo targetRevision main (values: chartVersion: main).
# Apps reach central Vault via SecretProviderClass vaultAddress (vp-sscsi-spc); optional default below for subchart.
# https://github.com/validatedpatterns/openshift-sscsi-vault-chart
---
ocpSecretsStoreCsiVault:
  clusterWide:
    installDefaultManifests: true

vault:
  global:
    # When non-empty, default address for components that need it (see chart README). SPC still sets vaultAddress.
    externalVaultAddr: ""
