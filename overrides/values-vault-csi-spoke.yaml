# Spoke/managed-cluster Vault release: CSI provider DaemonSet only (no Vault server). The hub cluster
# runs the full Vault; this chart supplies the provider that talks to https://vault-vault.<hubClusterDomain>.
# CA projection matches openshift-sscsi-vault sync TLS ConfigMap (see overrides/values-vault-csi-tls-ca.yaml).
---
vault:
  server:
    enabled: false
  ui:
    enabled: false
  injector:
    enabled: false
  csi:
    enabled: true
    volumes:
      - name: openshift-sscsi-vault-ca
        projected:
          defaultMode: 420
          sources:
            - configMap:
                name: openshift-sscsi-vault-vault-tls-ca
                optional: true
                items:
                  - key: ca-bundle.crt
                    path: ca-bundle.crt
    volumeMounts:
      - name: openshift-sscsi-vault-ca
        mountPath: /etc/pki/vault-ca
        readOnly: true
