# Referenced from values-hub.yaml clusterGroup.applications.vault.extraValueFiles so Argo merges this
# into the Vault Helm release. Mounts the ConfigMap at /etc/pki/vault-ca (must match
# openshift-sscsi-vault.caProvider.syncProviderCaConfigMap.mountDir).
#
# Default (openshift-sscsi-vault 0.0.15+): chart renders ConfigMap openshift-sscsi-vault-vault-tls-ca
# with inject-trusted-cabundle; CNO fills ca-bundle.crt (cluster defaults + Proxy trustedCA).
# SecretProviderClass vaultCACertPath points at mountDir/ca-bundle.crt.
#
# Project the whole ConfigMap (no `items` filter) so both modes work:
#   - CNO-injected bundle: ca-bundle.crt (optional CM until CNO writes data).
#   - GitOps PEM mode (injectTrustedCabundle: false + pemLiteral): vault-tls-ca.pem per openshift-sscsi-vault chart.
# A narrow `items: [ca-bundle.crt]` list alone breaks PEM-only ConfigMaps and causes TLS verify failures.
---
vault:
  csi:
    volumes:
      - name: openshift-sscsi-vault-ca
        projected:
          defaultMode: 420
          sources:
            - configMap:
                name: openshift-sscsi-vault-vault-tls-ca
                optional: true
    volumeMounts:
      - name: openshift-sscsi-vault-ca
        mountPath: /etc/pki/vault-ca
        readOnly: true
